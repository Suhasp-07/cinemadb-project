<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Directors — CinemaDB</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="marquee">
  <h1>Cinema<span>DB</span></h1>
  <p>Live view of the box office database</p>
</header>

<nav class="tabs">
  <a href="/index.html">Home</a>
  <a href="/movies.html">Movies</a>
  <a href="/theatres.html">Theatres</a>
  <a href="/screens.html">Screens</a>
  <a href="/shows.html">Shows</a>
  <a href="/actors.html">Actors</a>
  <a href="/directors.html" class="active">Directors</a>
  <a href="/producers.html">Producers</a>
  <a href="/customers.html">Customers</a>
  <a href="/bookings.html">Bookings</a>
  <a href="/payments.html">Payments</a>
  <a href="/login.html" id="logout-link">Logout</a>
</nav>

<main>
  <div class="panel-head">
    <h2>Directors</h2>
    <span class="count" id="count-directors"></span>
  </div>
  <div id="wrap-directors"></div>

  <h3 style="margin-top:2rem; font-size:1.1rem;">Add director</h3>
  <form class="entry-form" id="directors-form">
    <div class="field">
      <label for="d-name">Director name</label>
      <input type="text" id="d-name"  required>
    </div>
    <div class="field">
      <label for="d-dob">Date of birth</label>
      <input type="date" id="d-dob"  >
    </div>
    <div class="field">
      <label for="d-experience">Experience (years)</label>
      <input type="number" id="d-experience" min="0" >
    </div>
    <div class="full">
      <button type="submit">Add director</button>
    </div>
    <div id="directors-feedback" class="form-feedback full"></div>
  </form>
</main>

<script src="/js/auth.js"></script>
<script src="/js/common.js"></script>
<script>
  function reloadDirectors() { loadTable("/api/directors", "wrap-directors", "count-directors"); }
  reloadDirectors();

  wireJsonForm({
    formId: "directors-form",
    endpoint: "/api/directors",
    feedbackId: "directors-feedback",
    fieldMap: {"Director_Name": "d-name", "DOB": "d-dob", "Experience": "d-experience"},
    reload: reloadDirectors
  });
</script>

</body>
</html>
